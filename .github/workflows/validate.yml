name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Validate marketplace
        run: claude plugin validate . --strict
      - name: Check marketplace versions match plugin.json
        run: |
          mismatch=0
          while IFS= read -r row; do
            name="$(jq -r '.name' <<<"$row")"
            market_version="$(jq -r '.version // empty' <<<"$row")"
            source="$(jq -r '.source' <<<"$row")"
            plugin_json="$source/.claude-plugin/plugin.json"
            if [[ ! -f "$plugin_json" ]]; then
              echo "missing plugin.json for $name at $plugin_json"
              mismatch=1
              continue
            fi
            plugin_version="$(jq -r '.version' "$plugin_json")"
            if [[ -z "$market_version" ]]; then
              echo "$name: marketplace.json has no version (plugin.json is $plugin_version)"
              mismatch=1
            elif [[ "$market_version" != "$plugin_version" ]]; then
              echo "$name: marketplace.json version $market_version != plugin.json version $plugin_version"
              mismatch=1
            else
              echo "$name: $market_version matches"
            fi
          done < <(jq -c '.plugins[]' .claude-plugin/marketplace.json)
          exit "$mismatch"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Configure isolated Claude directory
        run: echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Install marketplace plugins
        run: |
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install ref-context@ref-tools --config api_key=ci-dummy
          claude plugin install ref-plan@ref-tools --config api_key=ci-dummy
      - name: Check discovered MCP servers
        run: |
          servers="$(claude mcp list 2>&1)"
          printf '%s\n' "$servers"
          grep -F "plugin:ref-context:" <<<"$servers" | grep -F "Needs authentication"
          grep -F "plugin:ref-plan:RefPlan" <<<"$servers"
