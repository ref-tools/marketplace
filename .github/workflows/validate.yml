name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Validate marketplace
        run: claude plugin validate . --strict

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Configure isolated Claude directory
        run: echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Install marketplace plugins
        run: |
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install ref-context@ref-tools --config api_key=ci-dummy
          claude plugin install ref-plan@ref-tools --config api_key=ci-dummy
          claude plugin install ref-design-process@ref-tools
          claude plugin install ref-using-local-devices@ref-tools
      - name: Check design-process skill
        run: |
          details="$(claude plugin details ref-design-process@ref-tools)"
          printf '%s\n' "$details"
          grep -F "Skills (1)  design-process" <<<"$details"
      - name: Check using-local-devices skill
        run: |
          details="$(claude plugin details ref-using-local-devices@ref-tools)"
          printf '%s\n' "$details"
          grep -F "Skills (1)  using-local-devices" <<<"$details"
      - name: Check discovered MCP servers
        run: |
          servers="$(claude mcp list 2>&1)"
          printf '%s\n' "$servers"
          grep -F "plugin:ref-context:" <<<"$servers" | grep -F "Needs authentication"
          grep -F "plugin:ref-plan:RefPlan" <<<"$servers"
