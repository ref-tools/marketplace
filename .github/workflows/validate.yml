name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Validate marketplace
        run: claude plugin validate . --strict
      - name: Check marketplace versions match plugin.json
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const marketplace = JSON.parse(
            fs.readFileSync(".claude-plugin/marketplace.json", "utf8")
          );
          const mismatches = [];
          for (const plugin of marketplace.plugins) {
            const pluginJsonPath = path.join(
              plugin.source,
              ".claude-plugin",
              "plugin.json"
            );
            if (!fs.existsSync(pluginJsonPath)) {
              mismatches.push(`${plugin.name}: missing ${pluginJsonPath}`);
              continue;
            }
            const pluginJson = JSON.parse(fs.readFileSync(pluginJsonPath, "utf8"));
            if (plugin.version == null) {
              mismatches.push(
                `${plugin.name}: marketplace.json has no version (plugin.json has ${pluginJson.version})`
              );
            } else if (plugin.version !== pluginJson.version) {
              mismatches.push(
                `${plugin.name}: marketplace.json=${plugin.version} plugin.json=${pluginJson.version}`
              );
            }
          }
          if (mismatches.length) {
            console.error("Version mismatch:");
            for (const line of mismatches) console.error(`  - ${line}`);
            process.exit(1);
          }
          console.log(
            `OK: ${marketplace.plugins.length} plugin version(s) match marketplace.json`
          );
          EOF

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Configure isolated Claude directory
        run: echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Install marketplace plugins
        run: |
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install ref-context@ref-tools --config api_key=ci-dummy
          claude plugin install ref-plan@ref-tools --config api_key=ci-dummy
      - name: Check discovered MCP servers
        run: |
          servers="$(claude mcp list 2>&1)"
          printf '%s\n' "$servers"
          grep -F "plugin:ref-context:" <<<"$servers" | grep -F "Needs authentication"
          grep -F "plugin:ref-plan:RefPlan" <<<"$servers"
