name: Codex

on:
  push:
  pull_request:

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.164.0
      - name: Add marketplace and require ref-context
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          listed="$(codex plugin list --marketplace ref-skills --available --json)"
          printf '%s\n' "$listed"
          LISTED="$listed" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ["LISTED"])
          names = {p["name"] for p in data.get("available", []) + data.get("installed", [])}
          missing = {"ref-context"} - names
          if missing:
              raise SystemExit(f"missing plugins from ref-skills marketplace: {sorted(missing)}; got {sorted(names)}")
          if "ref-plan" in names:
              raise SystemExit("ref-plan must not be in the Codex marketplace (no API-key collection path)")
          print("ok:", ", ".join(sorted(names)))
          PY
